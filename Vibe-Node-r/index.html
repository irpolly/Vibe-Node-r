<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Node(r)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-8932922389239426"
   crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
    }
    .react-flow__attribution {
      display: none !important;
    }
    .delete-mode .react-flow__node:hover,
    .delete-mode .react-flow__edge-path:hover {
      stroke: #ef4444 !important; /* red-500 */
      cursor: crosshair;
    }
    .delete-mode .react-flow__node:hover .react-flow__handle {
      background: #ef4444 !important;
    }
    .delete-mode .react-flow__node {
      cursor: crosshair;
    }
    .delete-mode .react-flow__node:hover > div {
       outline: 2px solid #ef4444;
    }
    /* UI Panel Styles (from my upgrade) */
    #ui-panel {
      position: absolute; top: 10px; left: 10px; width: 380px; z-index: 1000; pointer-events: none;
      background: rgba(0,0,0,0.8); border: 1px solid #0f0; border-radius: 8px; padding: 15px;
      font-size: 14px; line-height: 1.5; color: #0f0; font-family: 'Courier New', monospace;
    }
    #synopsis { margin-bottom: 15px; }
    #manager-feed { color: #0ff; font-style: italic; max-height: 200px; overflow-y: auto; }
  </style>
  <link rel="stylesheet" href="data:,">
</head>
<body class="bg-gray-900 text-gray-100">
  <div id="root"></div>
  <!-- Emulator Container with UI Panel (from my upgrade) -->
  <div id="emulator-container" style="position: relative; width: 100vw; height: 100vh; display: none;">
    <div id="game-container"></div>
    <div id="ui-panel">
      <div id="synopsis">Loading design vision...</div>
      <div id="manager-feed">> Booting agents...</div>
    </div>
  </div>
