
# This file provides explicit instructions for Google Cloud Build.
# It's used when you trigger a build from a Git repository via the Cloud Run UI.

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibe-coder-repo/vibe-node-r-backend:latest'
      - '.'
    id: 'Build'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibe-coder-repo/vibe-node-r-backend:latest'
    id: 'Push'

# Define the final image that was built.
# This is what Cloud Run will use to deploy.
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibe-coder-repo/vibe-node-r-backend:latest'

# Default substitutions provided by the Cloud Run trigger.
# You can add your own here if needed.
substitutions:
  _REGION: 'europe-west4'
