<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Node(r)</title>
  <script type="module" src="/src/index.tsx"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
    #emulator-container { position: relative; width: 100vw; height: 100vh; }
    #ui-panel {
      position: absolute; top: 10px; left: 10px; width: 380px; z-index: 1000; pointer-events: none;
      background: rgba(0,0,0,0.8); border: 1px solid #0f0; border-radius: 8px; padding: 15px;
      font-size: 14px; line-height: 1.5;
    }
    #synopsis { color: #0f0; margin-bottom: 15px; }
    #manager-feed { color: #0ff; font-style: italic; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="emulator-container">
    <div id="game-container"></div>
    <div id="ui-panel">
      <div id="synopsis">Loading design vision...</div>
      <div id="manager-feed">> Booting agents...</div>
    </div>
  </div>
</body>
</html>
